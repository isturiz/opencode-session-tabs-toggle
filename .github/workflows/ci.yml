name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: pnpm install --frozen-lockfile
      # prepack runs the test suite and typecheck before producing the archive.
      - run: pnpm pack
      - run: tar -tzf opencode-session-tabs-toggle-*.tgz
